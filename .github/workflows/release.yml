name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: feedss.exe
            artifact: feedss_windows_amd64.zip
          - goos: linux
            goarch: amd64
            binary: feedss
            artifact: feedss_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: feedss
            artifact: feedss_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary: feedss
            artifact: feedss_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary: feedss
            artifact: feedss_darwin_arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/package/${{ matrix.binary }}" .
          cp README.md dist/package/README.md
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd dist/package
            zip "../${{ matrix.artifact }}" "${{ matrix.binary }}" README.md
          else
            chmod +x "dist/package/${{ matrix.binary }}"
            tar -czf "dist/${{ matrix.artifact }}" -C dist/package "${{ matrix.binary }}" README.md
          fi

      - name: Upload release asset build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: binaries

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --title "$TAG"
          fi

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
