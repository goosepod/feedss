<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4d">
  <title>Choose a password · feedss</title>
  <link id="favicon" rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css?v=20260819-12">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="/">feedss</a>
    <form class="login-card" method="post" action="/change-password">
      <header class="login-heading">
        <h1>Choose your password</h1>
        <p>Welcome, {{.Username}}. Replace your temporary password before continuing.</p>
      </header>
      <div class="login-field">
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" maxlength="72" autofocus required>
      </div>
      <div class="login-field">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" maxlength="72" required>
      </div>
      <button class="login-submit" type="submit">Save password</button>
    </form>
  </main>
</body>
</html>
