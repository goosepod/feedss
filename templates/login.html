<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4d">
  <title>feedss login</title>
  <link id="favicon" rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css?v=20260819-1">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-brand" href="/login">feedss</a>
    <form class="login-card" method="post" action="/login">
      <header class="login-heading">
		{{if .Setup}}
		<h1>Create administrator</h1>
		<p>This is the first start of feedss. The account you create here will become the administrator and can add other users.</p>
		{{else}}
		<h1>Sign in</h1>
		<p>Continue to your feeds.</p>
		{{end}}
      </header>

      <div class="login-field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" autofocus required>
      </div>

      <div class="login-field">
        <label for="login-password">Password</label>
		<input id="login-password" name="password" type="password" autocomplete="{{if .Setup}}new-password{{else}}current-password{{end}}" maxlength="72" required>
      </div>

		<button class="login-submit" type="submit">{{if .Setup}}Create administrator{{else}}Sign in{{end}}</button>
    </form>
  </main>
</body>
</html>
